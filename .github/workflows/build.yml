      - name: Configure Gradle Java Home
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Patch geolocator_android build.gradle
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*geolocator_android*" 2>/dev/null | while read -r f; do
            echo "Patching $f"
            sed -i 's/flutter\.compileSdkVersion/36/g'           "$f"
            sed -i 's/flutter\.minSdkVersion/21/g'               "$f"
            sed -i 's/flutter\.targetSdkVersion/36/g'            "$f"
            sed -i 's/flutter\.ndkVersion/"29.0.14206865"/g'     "$f"
            grep -n "compileSdk\|minSdk\|targetSdk" "$f" || true
          done
          echo "geolocator_android patch done"

      - name: Configure release signing
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks 2>/dev/null || {
            echo "::error::Failed to decode KEYSTORE_BASE64."
            exit 1
          }
          KS_SIZE=$(wc -c < android/app/upload-keystore.jks)
          if [ "$KS_SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore only ${KS_SIZE} bytes — too small."
            exit 1
          fi
          echo "keystore decoded (${KS_SIZE} bytes)"
          cat > android/key.properties << EOF
storePassword=$KEYSTORE_PASSWORD
keyPassword=$KEY_PASSWORD
keyAlias=$KEY_ALIAS
storeFile=upload-keystore.jks
EOF
          echo "key.properties written"
          cat > /tmp/apply_signing.py << 'PYEOF'
import re, sys, os

p = 'android/app/build.gradle'
s = open(p).read()

if 'keystoreProperties' not in s:
    loader = (
        "def keystoreProperties = new Properties()\n"
        "def keystorePropertiesFile = rootProject.file('key.properties')\n"
        "if (keystorePropertiesFile.exists()) {\n"
        "    keystorePropertiesFile.withReader('UTF-8') { r -> keystoreProperties.load(r) }\n"
        "}\n\n"
    )
    s = s.replace("android {", loader + "android {", 1)

if 'signingConfigs {' not in s:
    sign_block = (
        "    signingConfigs {\n"
        "        release {\n"
        "            keyAlias keystoreProperties['keyAlias']\n"
        "            keyPassword keystoreProperties['keyPassword']\n"
        "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
        "            storePassword keystoreProperties['storePassword']\n"
        "        }\n"
        "    }\n\n"
        "    buildTypes {"
    )
    s = s.replace("    buildTypes {", sign_block, 1)

if 'signingConfigs.debug' in s:
    s = s.replace("signingConfig = signingConfigs.debug", "signingConfig = signingConfigs.release")
    s = s.replace("signingConfig signingConfigs.debug",   "signingConfig signingConfigs.release")
elif 'signingConfig' not in s.split('buildTypes {',1)[1].split('}',1)[0]:
    s = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)

assert s.count('    buildTypes {') == 1, f"Duplicate buildTypes! Count={s.count('    buildTypes {')}"
assert 'signingConfigs.release' in s, "signingConfigs.release not set"
assert 'signingConfigs.debug' not in s, "signingConfigs.debug still present"

open(p, 'w').write(s)
print("build.gradle signing configured")
PYEOF
          python3 /tmp/apply_signing.py
          echo "--- release buildType ---"
          grep -A12 "buildTypes {" android/app/build.gradle

      - name: Final Verification
        run: |
          echo "=== SDK values ==="
          grep -E "compileSdk|targetSdk|minSdk" android/app/build.gradle | grep -v "//"
          echo "=== ndkVersion ==="
          grep "ndkVersion" android/app/build.gradle
          echo "=== 16KB cmake flag ==="
          grep "FLEXIBLE_PAGE_SIZES" android/app/build.gradle
          echo "=== Plugin order ==="
          grep 'id "' android/app/build.gradle | head -6
          echo "=== LARGE_PAGE_SIZE in manifest ==="
          grep "LARGE_PAGE_SIZE" android/app/src/main/AndroidManifest.xml
          echo "=== AD_ID permission ==="
          grep "AD_ID" android/app/src/main/AndroidManifest.xml
          echo "=== No flutter.* SDK refs ==="
          if grep -q "flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion" android/app/build.gradle; then
            echo "::error::flutter.* SDK refs still present!"
            exit 1
          fi
          echo "No flutter.* refs remain"
          echo "=== Manifest XML validation ==="
          cat > /tmp/validate_xml.py << 'PYEOF'
import xml.etree.ElementTree as ET
ET.parse('android/app/src/main/AndroidManifest.xml')
print('AndroidManifest.xml valid XML')
PYEOF
          python3 /tmp/validate_xml.py
          echo "All checks passed — starting Gradle build"

      - name: Build Release APK
        run: flutter build apk --release --split-debug-info=build/debug-symbols --obfuscate

      - name: Build Release AAB
        run: flutter build appbundle --release --split-debug-info=build/debug-symbols --obfuscate

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-x-release-${{ github.sha }}
          path: build/app/outputs/
          retention-days: 14
