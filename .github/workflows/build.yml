name: Build Production Android Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install Android NDK 29 + Build Tools 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" "build-tools;36.1.0" "platforms;android-36" \
            --sdk_root=$ANDROID_HOME || \
          echo "y" | sdkmanager \
            "ndk;29.0.14206865" "build-tools;36.1.0" "platforms;android-36" || true
          echo "NDK 29 + build-tools 36 ready"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch flutter_inappwebview ProGuard
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*/flutter_inappwebview_android*" 2>/dev/null | while read -r f; do
            chmod +w "$f" 2>/dev/null || true
            sed -i "s/getDefaultProguardFile(\'proguard-android\.txt\')/getDefaultProguardFile(\'proguard-android-optimize.txt\')/g" "$f"
            echo "ProGuard patched: $f"
          done

      - name: Patch jcenter to mavenCentral
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          echo "jcenter replaced"

      - name: Regenerate Android Platform Files
        run: |
          rm -rf android
          flutter create --platforms android --org com.tlyfe --project-name nova_x .
          echo "android/ regenerated"

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "::error::google-services.json NOT FOUND in repo root!"
            exit 1
          fi

      - name: Set app icon from logo.png
        run: |
          pip install Pillow --break-system-packages -q
          echo "" | base64 -d > /tmp/gen_icons.py
          python3 /tmp/gen_icons.py

      - name: Apply Google Services Plugin (Firebase)
        run: |
          echo "" | base64 -d > /tmp/apply_gms.py
          python3 /tmp/apply_gms.py

      - name: Bump all SDK versions to API 36
        run: |
          F="android/app/build.gradle"
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/g' "$F"
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/g'               "$F"
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g'           "$F"
          sed -i 's/compileSdk 35/compileSdk 36/g'                                        "$F"
          sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/g'   "$F"
          sed -i 's/targetSdk flutter\.targetSdkVersion/targetSdk 36/g'                 "$F"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/g'             "$F"
          sed -i 's/targetSdk 35/targetSdk 36/g'                                         "$F"
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/g'            "$F"
          sed -i 's/minSdk flutter\.minSdkVersion/minSdk 23/g'                          "$F"
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/g'                      "$F"
          grep -E "compileSdk|targetSdk|minSdk" "$F"
          if grep -q "flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion" "$F"; then
            echo "::error::flutter.* SDK refs still present!"
            exit 1
          fi
          echo "All SDK versions set"

      - name: Inject NDK 29 + 16KB page size + abiFilters + packaging
        run: |
          echo "" | base64 -d > /tmp/inject_ndk.py
          python3 /tmp/inject_ndk.py

      - name: Patch AndroidManifest
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="nova_x"/android:label="NOVA X"/' "$M"
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>|' "$M"
          sed -i 's|android:icon="@mipmap/ic_launcher">|android:icon="@mipmap/ic_launcher"\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true">|' "$M"
          sed -i 's|android:name="android.permission.POST_NOTIFICATIONS"/>|android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>|' "$M"
          echo "AndroidManifest patched"

      - name: Add FCM + 16KB property to AndroidManifest
        run: |
          echo "" | base64 -d > /tmp/patch_manifest.py
          python3 /tmp/patch_manifest.py

      - name: Create notification colour resource
        run: |
          mkdir -p android/app/src/main/res/values
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="nova_x_cyan">#00D4FF</color>\n</resources>\n' > android/app/src/main/res/values/colors.xml
          echo "colors.xml created"

      - name: Write MainActivity.kt with shortcut support
        run: |
          mkdir -p android/app/src/main/kotlin/com/tlyfe/nova_x
          echo "" | base64 -d > android/app/src/main/kotlin/com/tlyfe/nova_x/MainActivity.kt
          echo "MainActivity.kt written"

      - name: Create shortcut resources
        run: |
          echo "" | base64 -d > /tmp/gen_shortcuts.py
          python3 /tmp/gen_shortcuts.py

      - name: Patch AndroidManifest for shortcuts
        run: |
          echo "" | base64 -d > /tmp/patch_shortcuts.py
          python3 /tmp/patch_shortcuts.py

      - name: Configure Gradle Java Home
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Patch geolocator_android build.gradle
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*geolocator_android*" 2>/dev/null | while read -r f; do
            sed -i 's/flutter\.compileSdkVersion/36/g'        "$f"
            sed -i 's/flutter\.minSdkVersion/21/g'            "$f"
            sed -i 's/flutter\.targetSdkVersion/36/g'         "$f"
            sed -i 's/flutter\.ndkVersion/"29.0.14206865"/g'  "$f"
            echo "geolocator patched: $f"
          done

      - name: Configure release signing
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
          KS_SIZE=$(wc -c < android/app/upload-keystore.jks)
          if [ "$KS_SIZE" -lt 1000 ]; then
            echo "::error::Keystore only ${KS_SIZE} bytes."
            exit 1
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "" | base64 -d > /tmp/apply_signing.py
          python3 /tmp/apply_signing.py
          grep -A12 "buildTypes {" android/app/build.gradle

      - name: Final Verification
        run: |
          echo "=== SDK values ==="
          grep -E "compileSdk|targetSdk|minSdk" android/app/build.gradle | grep -v "//"
          echo "=== ndkVersion ==="
          grep "ndkVersion" android/app/build.gradle
          echo "=== 16KB cmake flag ==="
          grep "FLEXIBLE_PAGE_SIZES" android/app/build.gradle
          echo "=== LARGE_PAGE_SIZE in manifest ==="
          grep "LARGE_PAGE_SIZE" android/app/src/main/AndroidManifest.xml
          echo "=== AD_ID permission ==="
          grep "AD_ID" android/app/src/main/AndroidManifest.xml
          if grep -q "flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion" android/app/build.gradle; then
            echo "::error::flutter.* SDK refs still present!"
            exit 1
          fi
          echo "aW1wb3J0IHhtbC5ldHJlZS5FbGVtZW50VHJlZSBhcyBFVApFVC5wYXJzZSgnYW5kcm9pZC9hcHAvc3JjL21haW4vQW5kcm9pZE1hbmlmZXN0LnhtbCcpCnByaW50KCdBbmRyb2lkTWFuaWZlc3QueG1sIHZhbGlkIFhNTCcpCg==" | base64 -d > /tmp/validate_xml.py
          python3 /tmp/validate_xml.py
          echo "All checks passed"

      - name: Build Release APK
        run: flutter build apk --release --split-debug-info=build/debug-symbols --obfuscate

      - name: Build Release AAB
        run: flutter build appbundle --release --split-debug-info=build/debug-symbols --obfuscate

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-x-release-${{ github.sha }}
          path: build/app/outputs/
          retention-days: 14
