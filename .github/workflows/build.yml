name: Build Production Android Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      # ── NOVA quality gates (before any Android work) ─────────────────────
      # Analyzer errors in NOVA or the files it touches fail the build.
      # (Warnings/infos are reported but not fatal. Scoped to these paths so
      # unrelated, unreachable legacy files can't block a release.)
      - name: Analyze NOVA and changed sources
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            lib/main.dart \
            lib/features/nova \
            lib/features/ai/screens/ai_assistant_screen.dart \
            lib/features/home/screens/home_screen.dart \
            lib/features/map/screens/nova_map_screen.dart \
            lib/features/settings/screens/settings_screen.dart \
            lib/features/browser/screens/browser_view.dart \
            lib/features/legal/screens/privacy_screen.dart \
            lib/features/legal/screens/terms_screen.dart \
            test/nova

      - name: NOVA unit tests
        run: flutter test test/nova

      - name: Patch flutter_inappwebview ProGuard
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*/flutter_inappwebview_android*" 2>/dev/null | while read -r f; do
            chmod +w "$f" 2>/dev/null || true
            sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
            echo "✓ ProGuard patched: $f"
          done

      - name: Patch jcenter to mavenCentral
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          echo "✓ jcenter replaced"

      - name: Ensure Android Platform Files Exist
        run: |
          # Backup our custom build.gradle (has minSdk=24, targetSdk=36, compileSdk=36)
          cp android/app/build.gradle /tmp/build_gradle_backup 2>/dev/null || true
          cp android/app/build.gradle.kts /tmp/build_gradle_kts_backup 2>/dev/null || true

          # Backup our real MainActivity + themes. They are the source of truth
          # for default-browser, links, shortcuts and biometrics — never replace them.
          cp android/app/src/main/kotlin/com/tlyfe/nova_x/MainActivity.kt /tmp/MainActivity.kt.bak
          mkdir -p /tmp/res_backup/values /tmp/res_backup/values-night
          cp android/app/src/main/res/values/styles.xml       /tmp/res_backup/values/styles.xml
          cp android/app/src/main/res/values-night/styles.xml /tmp/res_backup/values-night/styles.xml

          # Run flutter create to ensure all platform files are up to date.
          # --org com.tlyfe ensures it generates com/tlyfe/nova_x package.
          flutter create --platforms android --org com.tlyfe --project-name nova_x .
          echo "✓ flutter create done"

          # ── FIX 1: Remove com/example/ directory ────────────────────────
          # flutter create sometimes generates a second MainActivity.kt under
          # com/example/nova_x/ in addition to com/tlyfe/nova_x/.
          # Having TWO MainActivity classes causes:
          #   "Redeclaration: class MainActivity"
          #   "Unresolved reference: io" (because example package lacks Flutter imports)
          # Delete the wrong one entirely — only com/tlyfe/ should exist.
          rm -rf android/app/src/main/kotlin/com/example
          echo "✓ Deleted com/example/ (duplicate MainActivity removed)"

          # Restore our MainActivity + themes (flutter create must not alter them)
          mkdir -p android/app/src/main/kotlin/com/tlyfe/nova_x
          cp /tmp/MainActivity.kt.bak android/app/src/main/kotlin/com/tlyfe/nova_x/MainActivity.kt
          cp /tmp/res_backup/values/styles.xml       android/app/src/main/res/values/styles.xml
          mkdir -p android/app/src/main/res/values-night
          cp /tmp/res_backup/values-night/styles.xml android/app/src/main/res/values-night/styles.xml
          echo "✓ Restored repo MainActivity.kt and styles.xml"

          # Verify only the correct package directory remains
          echo "=== Kotlin source dirs after cleanup ==="
          find android/app/src/main/kotlin -name "*.kt" | sort

          # ── FIX 2: Remove duplicate settings.gradle ──────────────────────
          # flutter create generates settings.gradle.kts (Kotlin DSL).
          # If the repo also has settings.gradle (Groovy DSL), Gradle sees both
          # and prints: "settings.gradle.kts is ignored. This is likely a mistake."
          # The wrong file takes precedence. Keep only the .kts one.
          if [ -f "android/settings.gradle.kts" ] && [ -f "android/settings.gradle" ]; then
            rm android/settings.gradle
            echo "✓ Removed duplicate android/settings.gradle (kept .kts)"
          fi
          if [ -f "android/app/build.gradle.kts" ] && [ -f "android/app/build.gradle" ]; then
            rm android/app/build.gradle
            echo "✓ Removed duplicate android/app/build.gradle (kept .kts)"
          fi

          # ── Restore our custom build.gradle ─────────────────────────────
          # flutter create resets SDK versions — put our version back.
          if [ -f /tmp/build_gradle_kts_backup ]; then
            cp /tmp/build_gradle_kts_backup android/app/build.gradle.kts
            echo "✓ Restored custom build.gradle.kts (minSdk=24, targetSdk=36)"
          elif [ -f /tmp/build_gradle_backup ]; then
            # Only restore .gradle if no .kts exists (avoid duplicates)
            if [ ! -f "android/app/build.gradle.kts" ]; then
              cp /tmp/build_gradle_backup android/app/build.gradle
              echo "✓ Restored custom build.gradle (minSdk=24, targetSdk=36)"
            fi
          fi

          echo "=== Final android/ gradle files ==="
          find android -name "*.gradle" -o -name "*.gradle.kts" | sort

      - name: Detect Gradle DSL (Groovy vs Kotlin)
        run: |
          # Flutter 3.32.0+ generates Kotlin DSL (.kts files)
          # Flutter 3.27.x and below generates Groovy DSL (.gradle files)
          # Export the correct paths so every subsequent step uses the right files
          if [ -f "android/app/build.gradle.kts" ]; then
            echo "APP=android/app/build.gradle.kts" >> $GITHUB_ENV
          else
            echo "APP=android/app/build.gradle" >> $GITHUB_ENV
          fi
          if [ -f "android/settings.gradle.kts" ]; then
            echo "SET=android/settings.gradle.kts" >> $GITHUB_ENV
          else
            echo "SET=android/settings.gradle" >> $GITHUB_ENV
          fi
          echo "✓ DSL detected:"
          echo "  APP = $(cat $GITHUB_ENV | grep ^APP= | cut -d= -f2)"
          echo "  SET = $(cat $GITHUB_ENV | grep ^SET= | cut -d= -f2)"

      - name: Upgrade Gradle wrapper to 8.14 (Flutter 3.47+ minimum)
        run: |
          WRAPPER="android/gradle/wrapper/gradle-wrapper.properties"
          # Flutter 3.47.5 requires Gradle >= 8.14.0
          # Repo ships gradle-8.9 which causes:
          # "Your project's Gradle version (8.9.0) is lower than Flutter's
          #  minimum supported version of 8.14.0"
          sed -i 's|gradle-8\.9-all\.zip|gradle-8.14-all.zip|g'   "$WRAPPER"
          sed -i 's|gradle-8\.9-bin\.zip|gradle-8.14-bin.zip|g'   "$WRAPPER"
          sed -i 's|gradle-8\.10-all\.zip|gradle-8.14-all.zip|g'  "$WRAPPER"
          sed -i 's|gradle-8\.10-bin\.zip|gradle-8.14-bin.zip|g'  "$WRAPPER"
          sed -i 's|gradle-8\.11-all\.zip|gradle-8.14-all.zip|g'  "$WRAPPER"
          sed -i 's|gradle-8\.12-all\.zip|gradle-8.14-all.zip|g'  "$WRAPPER"
          sed -i 's|gradle-8\.13-all\.zip|gradle-8.14-all.zip|g'  "$WRAPPER"
          # Hard-set if none of the above matched (e.g. no wrapper existed before)
          if ! grep -q "gradle-8\.14" "$WRAPPER"; then
            sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14-all.zip|' "$WRAPPER"
          fi
          echo "✓ Gradle wrapper version:"
          grep distributionUrl "$WRAPPER"

      - name: Inject versionCode and versionName from pubspec into local.properties
        run: |
          # flutter create resets local.properties to versionCode=1 / versionName=1.0
          # This step overwrites those values with what pubspec.yaml declares,
          # so Play Store receives the correct incrementing versionCode every build.
          VERSION_LINE=$(grep '^version:' pubspec.yaml | head -1)
          # e.g. "version: 3.1.0+4"
          VERSION_NAME=$(echo "$VERSION_LINE" | sed 's/version: //' | cut -d'+' -f1 | tr -d ' ')
          VERSION_CODE=$(echo "$VERSION_LINE" | sed 's/version: //' | cut -d'+' -f2 | tr -d ' ')
          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not parse version from pubspec.yaml: $VERSION_LINE"
            exit 1
          fi
          LP="android/local.properties"
          # Remove any existing flutter.versionCode/Name lines then append correct ones
          sed -i '/^flutter\.versionCode=/d' "$LP"
          sed -i '/^flutter\.versionName=/d' "$LP"
          echo "flutter.versionCode=$VERSION_CODE" >> "$LP"
          echo "flutter.versionName=$VERSION_NAME" >> "$LP"
          echo "✓ local.properties updated: versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          grep "flutter.version" "$LP"

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "✓ google-services.json copied"
          else
            echo "::error::google-services.json NOT FOUND in repo root!"
            exit 1
          fi

      # ── App icon: styled icon with blue background + properly scaled logo ────
      # Fixes: (1) transparent logo showing white bg on Android
      #        (2) distorted aspect ratio from naive square resize
      #        (3) logo too small — now fills 90% of icon space
      - name: Set app icon from logo.png
        run: |
          pip install Pillow --break-system-packages -q
          python3 << 'PYEOF2'
          from PIL import Image, ImageDraw
          import os

          BG = (7, 16, 30, 255)
          logo = Image.open('assets/images/logo.png').convert('RGBA')
          bbox = logo.getbbox()
          if bbox: logo = logo.crop(bbox)
          lw, lh = logo.size
          half = min(lw, lh) // 2
          cx, cy = lw // 2, lh // 2
          logo = logo.crop((cx-half, cy-half, cx+half, cy+half))

          std = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,
                 'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for d, sz in std.items():
              out = 'android/app/src/main/res/' + d
              os.makedirs(out, exist_ok=True)
              bg = Image.new('RGBA',(sz,sz),BG)
              ls = int(sz*0.78)
              lr = logo.resize((ls,ls),Image.LANCZOS)
              off = (sz-ls)//2
              bg.paste(lr,(off,off),lr)
              bg.convert('RGB').save(out+'/ic_launcher.png')
              circ = Image.new('RGBA',(sz,sz),(0,0,0,0))
              msk  = Image.new('L',(sz,sz),0)
              ImageDraw.Draw(msk).ellipse((0,0,sz,sz),fill=255)
              circ.paste(bg.convert('RGBA'),(0,0),msk)
              circ.save(out+'/ic_launcher_round.png')

          adapt = {'mipmap-mdpi':72,'mipmap-hdpi':108,'mipmap-xhdpi':144,
                   'mipmap-xxhdpi':216,'mipmap-xxxhdpi':288}
          for d, sz in adapt.items():
              out = 'android/app/src/main/res/' + d
              os.makedirs(out, exist_ok=True)
              fg = Image.new('RGBA',(sz,sz),(0,0,0,0))
              ls = int(sz*0.64)
              lr = logo.resize((ls,ls),Image.LANCZOS)
              off = (sz-ls)//2
              fg.paste(lr,(off,off),lr)
              fg.save(out+'/ic_launcher_foreground.png')

          # Write XML resource files (all in Python to avoid YAML heredoc issues)
          anydpi = 'android/app/src/main/res/mipmap-anydpi-v26'
          values = 'android/app/src/main/res/values'
          os.makedirs(anydpi, exist_ok=True)
          os.makedirs(values, exist_ok=True)

          bg_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<resources>\n'
              '    <color name="ic_launcher_background">#07101E</color>\n'
              '</resources>\n'
          )
          with open(values+'/ic_launcher_background.xml','w') as f: f.write(bg_xml)

          adaptive_xml = (
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android='
              '"http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@color/ic_launcher_background"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n'
          )
          with open(anydpi+'/ic_launcher.xml','w') as f: f.write(adaptive_xml)
          with open(anydpi+'/ic_launcher_round.xml','w') as f: f.write(adaptive_xml)

          print('Icon + adaptive XML done')
          PYEOF2

      # ── Firebase: add google-services plugin inside plugins {} block ──────
      - name: Apply Google Services Plugin (Firebase)
        run: |
          # $APP and $SET are set by the "Detect Gradle DSL" step above
          echo "Using: APP=$APP  SET=$SET"

          # Choose correct plugin syntax based on DSL type
          if [[ "$SET" == *.kts ]]; then
            # Kotlin DSL — must use id("...") with parentheses
            SET_PLUGIN='    id("com.google.gms.google-services") version "4.4.0" apply false'
            SET_ANCHOR='id("com.android.application")'
          else
            # Groovy DSL — uses id "..." without parentheses
            SET_PLUGIN='    id "com.google.gms.google-services" version "4.4.0" apply false'
            SET_ANCHOR='id "com.android.application" version'
          fi

          if [[ "$APP" == *.kts ]]; then
            APP_PLUGIN='    id("com.google.gms.google-services")'
          else
            APP_PLUGIN='    id "com.google.gms.google-services"'
          fi

          if ! grep -q "com.google.gms.google-services" "$SET"; then
            sed -i "/$SET_ANCHOR/a\\$SET_PLUGIN" "$SET"
            echo "✓ google-services declared in $SET"
          fi
          if ! grep -q "com.google.gms.google-services" "$APP"; then
            sed -i "/^plugins {/a\\$APP_PLUGIN" "$APP"
            echo "✓ google-services applied in $APP"
          fi
          if head -3 "$APP" | grep -q "^apply plugin"; then
            echo "::error::apply plugin: found before plugins {} — Gradle will fail"
            exit 1
          fi
          echo "✅ Firebase Gradle verified"

      - name: Bump compileSdk, targetSdk to 36 and minSdk to 24
        run: |
          F="$APP"
          # ── compileSdk → 36 ──────────────────────────────────────────────
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/g' "$F"
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/g'               "$F"
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g'           "$F"
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/g'               "$F"
          sed -i 's/compileSdk 35/compileSdk 36/g'                                       "$F"
          sed -i 's/compileSdk 34/compileSdk 36/g'                                       "$F"
          # ── targetSdk → 36 ──────────────────────────────────────────────
          sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/g'   "$F"
          sed -i 's/targetSdk flutter\.targetSdkVersion/targetSdk 36/g'                 "$F"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/g'             "$F"
          sed -i 's/targetSdk 35/targetSdk 36/g'                                        "$F"
          sed -i 's/targetSdk 34/targetSdk 36/g'                                        "$F"
          # ── minSdk → 24 ─────────────────────────────────────────────────
          # MUST be 24+ for Google Play Automatic Protection (Play Protect).
          # Our repo build.gradle already has minSdk 24 — this guards against
          # flutter create or plugin patches accidentally setting a lower value.
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 24/g'            "$F"
          sed -i 's/minSdk flutter\.minSdkVersion/minSdk 24/g'                          "$F"
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 24/g'                      "$F"
          sed -i 's/minSdkVersion 21/minSdkVersion 24/g'                                "$F"
          sed -i 's/minSdk 21/minSdk 24/g'                                              "$F"
          sed -i 's/minSdkVersion 22/minSdkVersion 24/g'                                "$F"
          sed -i 's/minSdk 22/minSdk 24/g'                                              "$F"
          sed -i 's/minSdkVersion 23/minSdkVersion 24/g'                                "$F"
          sed -i 's/minSdk 23/minSdk 24/g'                                              "$F"
          # Also handle Kotlin DSL (= syntax)
          sed -i 's/minSdk = 21/minSdk = 24/g'                                          "$F"
          sed -i 's/minSdk = 22/minSdk = 24/g'                                          "$F"
          sed -i 's/minSdk = 23/minSdk = 24/g'                                          "$F"
          # ── ndkVersion → 27.0.12077973 ──────────────────────────────────
          # Flutter 3.32.0 defaults to NDK 26.3.11579264 but all plugins
          # (firebase, geolocator, speech_to_text etc.) require 27.0.12077973.
          # Replace flutter.ndkVersion variable OR inject after android { block.
          sed -i 's/ndkVersion = flutter\.ndkVersion/ndkVersion = "27.0.12077973"/g'   "$F"
          sed -i 's/ndkVersion flutter\.ndkVersion/ndkVersion "27.0.12077973"/g'        "$F"
          # If ndkVersion not present at all, inject it after android { line
          if ! grep -q "ndkVersion" "$F"; then
            sed -i '/^android {/a\    ndkVersion = "27.0.12077973"' "$F"
            echo "✓ ndkVersion injected into android block"
          fi
          # ── HARD VERIFICATION — fail fast if minSdk is still below 24 ───
          MINSDK_VAL=$(grep -E "^\s*minSdk[^V]" "$F" | grep -o '[0-9]\+' | head -1)
          if [ -n "$MINSDK_VAL" ] && [ "$MINSDK_VAL" -lt 24 ]; then
            echo "::error::minSdk is $MINSDK_VAL after patching — Play Store requires 24+ for Automatic Protection. Check $F"
            cat "$F"
            exit 1
          fi
          echo "✓ compileSdk=36, targetSdk=36, minSdk=24, ndkVersion=27.0.12077973 applied"
          grep -E "compileSdk|targetSdk|minSdk|ndkVersion" "$F"

      # ── AppCompat — required by the AppCompat themes (local_auth) ─────────
      - name: Ensure AppCompat dependency
        run: |
          if ! grep -q "androidx.appcompat:appcompat" "$APP"; then
            printf '\ndependencies {\n    implementation("androidx.appcompat:appcompat:1.7.0")\n}\n' >> "$APP"
            echo "✓ appcompat added to $APP"
          else
            echo "appcompat already declared in $APP"
          fi
          grep -n "appcompat" "$APP"

      # ── "Hey NOVA" wake word engine (sherpa-onnx, Apache-2.0) ─────────────
      # The engine AAR (~50 MB) is downloaded here and checked against a pinned
      # SHA-256, so it never has to be committed. The small model files live in
      # the repo (android/app/src/main/assets/nova_kws/). Only the JNI library
      # and ONNX Runtime for ARM phones are packaged.
      - name: Ensure Hey NOVA wake-word engine
        run: |
          set -e
          VER=1.13.8
          SHA=633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96
          mkdir -p android/app/libs
          AAR="android/app/libs/sherpa-onnx-$VER.aar"
          if [ ! -f "$AAR" ] || ! echo "$SHA  $AAR" | sha256sum -c --status; then
            curl -fsSL --retry 3 -o "$AAR" "https://github.com/k2-fsa/sherpa-onnx/releases/download/v$VER/sherpa-onnx-$VER.aar"
          fi
          echo "$SHA  $AAR" | sha256sum -c -
          if ! grep -q "sherpa-onnx-$VER.aar" "$APP"; then
            cat >> "$APP" <<'GRADLE'

          // NOVA "Hey NOVA" wake word (sherpa-onnx) — added by CI
          android {
              packaging {
                  jniLibs.excludes.add("**/libsherpa-onnx-c-api.so")
                  jniLibs.excludes.add("**/libsherpa-onnx-cxx-api.so")
                  jniLibs.excludes.add("lib/x86/libsherpa-onnx-jni.so")
                  jniLibs.excludes.add("lib/x86/libonnxruntime.so")
                  jniLibs.excludes.add("lib/x86_64/libsherpa-onnx-jni.so")
                  jniLibs.excludes.add("lib/x86_64/libonnxruntime.so")
              }
          }
          dependencies {
              implementation(files("libs/sherpa-onnx-1.13.8.aar"))
          }
          GRADLE
            echo "✓ sherpa-onnx added to $APP"
          else
            echo "sherpa-onnx already declared in $APP"
          fi
          for f in encoder.int8.onnx decoder.int8.onnx joiner.int8.onnx tokens.txt keywords.txt; do
            test -s "android/app/src/main/assets/nova_kws/$f" \
              || { echo "::error::Missing Hey NOVA model file assets/nova_kws/$f"; exit 1; }
          done
          test -f android/app/proguard-rules.pro && grep -q "com.k2fsa.sherpa.onnx" android/app/proguard-rules.pro \
            || { echo "::error::proguard-rules.pro must keep com.k2fsa.sherpa.onnx (JNI)"; exit 1; }
          grep -q 'NovaWakeService' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::NovaWakeService missing from AndroidManifest.xml"; exit 1; }
          echo "✓ Hey NOVA engine ready"

      # ── Manifest patch ───────────────────────────────────────────────────
      # DO NOT add android:launchMode here — Flutter 3.27.4 already generates
      # it in the activity tag. Adding it again creates a duplicate XML
      # attribute which causes: "Error parsing AndroidManifest.xml"
      - name: Patch AndroidManifest
        run: |
          M="android/app/src/main/AndroidManifest.xml"
          sed -i 's/android:label="nova_x"/android:label="NOVA X"/' "$M"
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>|' "$M"
          sed -i 's|android:icon="@mipmap/ic_launcher">|android:icon="@mipmap/ic_launcher"\n        android:usesCleartextTraffic="true"\n        android:hardwareAccelerated="true">|' "$M"
          # Add Maps API key and location permissions
          sed -i 's|android:name="android.permission.POST_NOTIFICATIONS"/>|android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>|' "$M"
          echo "✓ AndroidManifest patched (label + permissions + app attributes)"

      # ── FCM tap fix — separate safe step using Python ─────────────────────
      # Adds FLUTTER_NOTIFICATION_CLICK intent-filter so tapping a push
      # notification opens the app. Uses Python for safe XML insertion without
      # risking duplicate attributes.
      - name: Add FCM notification tap support
        run: |
          python3 << 'PYEOF'
          content = open('android/app/src/main/AndroidManifest.xml').read()

          # Add FLUTTER_NOTIFICATION_CLICK intent-filter after the first
          # </intent-filter> (the launcher one). Only if not already present.
          if 'FLUTTER_NOTIFICATION_CLICK' not in content:
              fcm_filter = (
                  '</intent-filter>\n'
                  '            <intent-filter>\n'
                  '                <action android:name="FLUTTER_NOTIFICATION_CLICK"/>\n'
                  '                <category android:name="android.intent.category.DEFAULT"/>\n'
                  '            </intent-filter>'
              )
              content = content.replace('</intent-filter>', fcm_filter, 1)
              print('✓ FLUTTER_NOTIFICATION_CLICK intent-filter added')
          else:
              print('FLUTTER_NOTIFICATION_CLICK already present — skipping')

          # Add FCM channel + icon + colour metadata before </application>.
          # Only if not already present.
          if 'nova_x_channel' not in content:
              fcm_meta = (
                  '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="nova_x_channel"/>\n'
                  '        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@mipmap/ic_launcher"/>\n'
                  '        <meta-data android:name="com.google.firebase.messaging.default_notification_color" android:resource="@color/nova_x_cyan"/>\n'
                  '        <meta-data android:name="com.google.android.geo.API_KEY" android:value="AIzaSyBc_bNBj_hmsG5rNFXHC4Tmgp0BRBjyXos"/>\n'
                  '    </application>'
              )
              content = content.replace('    </application>', fcm_meta, 1)
              print('✓ FCM channel metadata added')
          else:
              print('FCM channel metadata already present — skipping')

          open('android/app/src/main/AndroidManifest.xml', 'w').write(content)
          PYEOF

          echo "--- Final AndroidManifest.xml ---"
          cat android/app/src/main/AndroidManifest.xml

      # ── Notification colour (cyan) ─────────────────────────────────────────
      - name: Create notification colour resource
        run: |
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/colors.xml << 'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="nova_x_cyan">#00D4FF</color>
          </resources>
          XMLEOF
          echo "✓ colors.xml created"


      # ── MainActivity.kt — repo file is the source of truth ───────────────────
      # This step used to OVERWRITE MainActivity.kt with a stub that only had
      # the shortcuts channel. That stub removed the default-browser channel,
      # the incoming-link handling and FlutterFragmentActivity, so every
      # "Set as default" button silently did nothing, links opened only the
      # home page, and biometric unlock failed. Now we only verify it.
      - name: Verify MainActivity.kt (default browser + links + shortcuts)
        run: |
          rm -rf android/app/src/main/kotlin/com/example
          F="android/app/src/main/kotlin/com/tlyfe/nova_x/MainActivity.kt"
          test -f "$F" || { echo "::error::$F missing"; exit 1; }
          for needle in \
              "package com.tlyfe.nova_x" \
              "FlutterFragmentActivity" \
              "com.tlyfe.nova_x/default_browser" \
              "com.tlyfe.nova_x/permissions" \
              "com.tlyfe.nova_x/shortcuts" \
              "createRequestRoleIntent" \
              "onNewIntent"; do
            grep -q "$needle" "$F" || { echo "::error::MainActivity.kt is missing: $needle"; exit 1; }
          done
          COUNT=$(find android/app/src/main/kotlin -name "MainActivity.kt" | wc -l)
          [ "$COUNT" -eq 1 ] || { echo "::error::Expected 1 MainActivity.kt, found $COUNT"; exit 1; }
          grep -q 'android:launchMode="singleTask"' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::MainActivity must use launchMode singleTask"; exit 1; }
          grep -A1 'flutter_deeplinking_enabled' android/app/src/main/AndroidManifest.xml | grep -q 'android:value="false"' \
            || { echo "::error::flutter_deeplinking_enabled must be false (browser links)"; exit 1; }
          # NOVA assistant native layer
          grep -q 'NovaBridge' "$F" || { echo "::error::MainActivity must register NovaBridge"; exit 1; }
          for f in NovaAssistActivity.kt nova/NovaBridge.kt nova/NovaRecorder.kt nova/NovaSpeaker.kt \
                   nova/NovaDeviceActions.kt nova/NovaAssistantRole.kt; do
            test -f "android/app/src/main/kotlin/com/tlyfe/nova_x/$f" \
              || { echo "::error::Missing NOVA native file $f"; exit 1; }
          done
          grep -q 'android.intent.action.ASSIST' android/app/src/main/AndroidManifest.xml \
            || { echo "::error::NOVA assistant activity (ACTION_ASSIST) missing from manifest"; exit 1; }
          grep -q 'NovaAssistTheme' android/app/src/main/res/values/styles.xml \
            || { echo "::error::NovaAssistTheme missing from styles.xml"; exit 1; }
          echo "✓ MainActivity.kt verified"

      - name: Create shortcut resources
        run: |
          python3 - << 'PYEOF2'
          import os, textwrap
          os.makedirs('android/app/src/main/res/xml',      exist_ok=True)
          os.makedirs('android/app/src/main/res/drawable', exist_ok=True)

          open('android/app/src/main/res/xml/shortcuts.xml','w').write(textwrap.dedent('''
            <?xml version="1.0" encoding="utf-8"?>
            <shortcuts xmlns:android="http://schemas.android.com/apk/res/android">
              <shortcut android:shortcutId="new_tab" android:enabled="true"
                  android:icon="@drawable/ic_sc_new_tab"
                  android:shortcutShortLabel="@string/sc_new_tab_s"
