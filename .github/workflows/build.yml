name: Build Production Android Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: ''

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true

      - name: Install Android NDK 29 + Build Tools 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" "build-tools;36.1.0" "platforms;android-36" \
            --sdk_root=$ANDROID_HOME || \
          echo "y" | sdkmanager \
            "ndk;29.0.14206865" "build-tools;36.1.0" "platforms;android-36" || true
          echo "NDK 29 + build-tools 36 + platform-36 ready"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Patch flutter_inappwebview ProGuard
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*/flutter_inappwebview_android*" 2>/dev/null | while read -r f; do
            chmod +w "$f" 2>/dev/null || true
            sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$f"
            echo "ProGuard patched: $f"
          done

      - name: Patch jcenter to mavenCentral
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} +
          echo "jcenter replaced"

      - name: Regenerate Android Platform Files
        run: |
          rm -rf android
          flutter create --platforms android --org com.tlyfe --project-name nova_x .
          echo "android/ regenerated"

      - name: Copy google-services.json
        run: |
          if [ -f "google-services.json" ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json copied"
          else
            echo "::error::google-services.json NOT FOUND in repo root!"
            exit 1
          fi

      - name: Set app icon from logo.png
        run: |
          pip install Pillow --break-system-packages -q
          cat > /tmp/gen_icons.py << 'PYEOF'
from PIL import Image, ImageDraw
import os

BG = (7, 16, 30, 255)
logo = Image.open('assets/images/logo.png').convert('RGBA')
bbox = logo.getbbox()
if bbox:
    logo = logo.crop(bbox)
lw, lh = logo.size
half = min(lw, lh) // 2
cx, cy = lw // 2, lh // 2
logo = logo.crop((cx-half, cy-half, cx+half, cy+half))

std = {'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,
       'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
for d, sz in std.items():
    out = 'android/app/src/main/res/' + d
    os.makedirs(out, exist_ok=True)
    bg = Image.new('RGBA',(sz,sz),BG)
    ls = int(sz*0.78)
    lr = logo.resize((ls,ls),Image.LANCZOS)
    off = (sz-ls)//2
    bg.paste(lr,(off,off),lr)
    bg.convert('RGB').save(out+'/ic_launcher.png')
    circ = Image.new('RGBA',(sz,sz),(0,0,0,0))
    msk  = Image.new('L',(sz,sz),0)
    ImageDraw.Draw(msk).ellipse((0,0,sz,sz),fill=255)
    circ.paste(bg.convert('RGBA'),(0,0),msk)
    circ.save(out+'/ic_launcher_round.png')

adapt = {'mipmap-mdpi':72,'mipmap-hdpi':108,'mipmap-xhdpi':144,
         'mipmap-xxhdpi':216,'mipmap-xxxhdpi':288}
for d, sz in adapt.items():
    out = 'android/app/src/main/res/' + d
    os.makedirs(out, exist_ok=True)
    fg = Image.new('RGBA',(sz,sz),(0,0,0,0))
    ls = int(sz*0.64)
    lr = logo.resize((ls,ls),Image.LANCZOS)
    off = (sz-ls)//2
    fg.paste(lr,(off,off),lr)
    fg.save(out+'/ic_launcher_foreground.png')

anydpi = 'android/app/src/main/res/mipmap-anydpi-v26'
values = 'android/app/src/main/res/values'
os.makedirs(anydpi, exist_ok=True)
os.makedirs(values, exist_ok=True)

with open(values+'/ic_launcher_background.xml','w') as f:
    f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#07101E</color>\n</resources>\n')

adaptive_xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
    '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
    '    <background android:drawable="@color/ic_launcher_background"/>\n'
    '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
    '</adaptive-icon>\n')
with open(anydpi+'/ic_launcher.xml','w') as f: f.write(adaptive_xml)
with open(anydpi+'/ic_launcher_round.xml','w') as f: f.write(adaptive_xml)
print('Icon + adaptive XML done')
PYEOF
          python3 /tmp/gen_icons.py

      - name: Apply Google Services Plugin (Firebase)
        run: |
          cat > /tmp/apply_gms.py << 'PYEOF'
import re, sys, os

app_path = 'android/app/build.gradle'
set_path = 'android/settings.gradle'

if not os.path.exists(app_path):
    print(f"ERROR: {app_path} not found. CWD={os.getcwd()}", file=sys.stderr)
    sys.exit(1)

app = open(app_path).read()
settings = open(set_path).read()

# Declare in settings.gradle after com.android.application
if 'com.google.gms.google-services' not in settings:
    settings = re.sub(
        r'(id "com\.android\.application" version "[^"]*" apply false)',
        r'\1\n    id "com.google.gms.google-services" version "4.4.2" apply false',
        settings, count=1
    )
    open(set_path, 'w').write(settings)
    print("google-services declared in settings.gradle")

# Apply in app/build.gradle AFTER flutter-gradle-plugin
if 'com.google.gms.google-services' not in app:
    app = re.sub(
        r'(id "dev\.flutter\.flutter-gradle-plugin")',
        r'\1\n    id "com.google.gms.google-services"',
        app, count=1
    )
    open(app_path, 'w').write(app)
    print("google-services applied after flutter-gradle-plugin")

# Verify order
app2 = open(app_path).read()
plugin_lines = [l.strip() for l in app2.split('\n')
                if 'id "' in l and 'apply false' not in l]
print("Plugin order:", plugin_lines)
idx_app = next(i for i,l in enumerate(plugin_lines) if 'com.android.application' in l)
idx_gms = next(i for i,l in enumerate(plugin_lines) if 'google-services' in l)
assert idx_gms > idx_app, "FATAL: google-services before com.android.application!"
print("Plugin order correct")
PYEOF
          python3 /tmp/apply_gms.py

      - name: Bump all SDK versions to API 36
        run: |
          F="android/app/build.gradle"
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/g' "$F"
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/g'               "$F"
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g'           "$F"
          sed -i 's/compileSdk 35/compileSdk 36/g'                                       "$F"
          sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/g'   "$F"
          sed -i 's/targetSdk flutter\.targetSdkVersion/targetSdk 36/g'                 "$F"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/g'             "$F"
          sed -i 's/targetSdk 35/targetSdk 36/g'                                        "$F"
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/g'            "$F"
          sed -i 's/minSdk flutter\.minSdkVersion/minSdk 23/g'                          "$F"
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/g'                      "$F"
          grep -E "compileSdk|targetSdk|minSdk" "$F"
          if grep -q "flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion" "$F"; then
            echo "::error::flutter.* SDK refs still present!"
            exit 1
          fi
          echo "All SDK versions set, no flutter.* refs remain"

      - name: Inject NDK 29 + 16KB page size + abiFilters + packaging
        run: |
          cat > /tmp/inject_ndk.py << 'PYEOF'
import re, sys, os

p = 'android/app/build.gradle'
if not os.path.exists(p):
    print(f"ERROR: {p} not found", file=sys.stderr)
    sys.exit(1)
s = open(p).read()

if 'ndkVersion' not in s:
    s = re.sub(
        r'(compileSdk\s+36)',
        r'\1\n    ndkVersion "29.0.14206865"\n    buildToolsVersion "36.1.0"',
        s, count=1
    )
assert 'ndkVersion "29.0.14206865"' in s, "ndkVersion not set"

if 'ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES' not in s:
    s = re.sub(
        r'(versionName[^\n]*\n)(\s*\})',
        r'\1'
        r'        multiDexEnabled true\n'
        r'        ndk { abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64" }\n'
        r'        externalNativeBuild {\n'
        r'            cmake { arguments += "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON" }\n'
        r'        }\n'
        r'\2',
        s, count=1
    )
assert 'ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES' in s, "cmake 16KB flag not injected"
assert 'abiFilters' in s, "abiFilters not injected"

if 'useLegacyPackaging' not in s:
    packaging = (
        '    packagingOptions {\n'
        '        resources { excludes += [\'/META-INF/{AL2.0,LGPL2.1}\'] }\n'
        '        jniLibs { useLegacyPackaging = false }\n'
        '    }\n\n'
        '    buildTypes {'
    )
    s = s.replace('    buildTypes {', packaging, 1)
assert s.count('    buildTypes {') == 1, "Duplicate buildTypes block!"
assert 'useLegacyPackaging = false' in s, "useLegacyPackaging not set"

if 'SYMBOL_TABLE' not in s:
    s = re.sub(
        r'(release\s*\{)',
        r"\1\n            ndk { debugSymbolLevel 'SYMBOL_TABLE' }",
        s, count=1
    )

open(p, 'w').write(s)
print("NDK 29 + 16KB + packaging injected")
for line in s.split('\n'):
    if any(x in line for x in ['compileSdk','targetSdk','minSdk','ndkVersion',
                                 'abiFilter','FLEXIBLE','useLegacy','SYMBOL']):
        print(" ", line.strip())
PYEOF
          python3 /tmp/inject_ndk.py

