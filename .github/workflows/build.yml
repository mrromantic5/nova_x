              <string name="sc_new_tab_s">New Tab</string>
              <string name="sc_new_tab_l">Open New Tab in NOVA X</string>
              <string name="sc_private_s">Private Tab</string>
              <string name="sc_private_l">Open Private Browsing</string>
              <string name="sc_business_s">Business</string>
              <string name="sc_business_l">NOVA X Business Directory</string>
            </resources>
          ''').strip())

          print('shortcut XML, icons, strings created')
          PYEOF2

      - name: Patch AndroidManifest for shortcuts
        run: |
          python3 - << 'PYEOF3'
          content = open('android/app/src/main/AndroidManifest.xml').read()
          if 'android.app.shortcuts' not in content:
              block = (
                '        <meta-data android:name="android.app.shortcuts" '
                'android:resource="@xml/shortcuts"/>\n'
                '        <intent-filter>\n'
                '            <action android:name="com.tlyfe.nova_x.NEW_TAB"/>\n'
                '            <category android:name="android.intent.category.DEFAULT"/>\n'
                '        </intent-filter>\n'
                '        <intent-filter>\n'
                '            <action android:name="com.tlyfe.nova_x.PRIVATE_TAB"/>\n'
                '            <category android:name="android.intent.category.DEFAULT"/>\n'
                '        </intent-filter>\n'
                '        <intent-filter>\n'
                '            <action android:name="com.tlyfe.nova_x.BUSINESS"/>\n'
                '            <category android:name="android.intent.category.DEFAULT"/>\n'
                '        </intent-filter>\n'
                '    </activity>'
              )
              content = content.replace('    </activity>', block, 1)
              open('android/app/src/main/AndroidManifest.xml','w').write(content)
              print('Shortcut manifest metadata added')
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest valid XML')
          PYEOF3

      - name: Configure Gradle Java Home
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Final Verification
        run: |
          echo "=== google-services.json ==="
          ls -la android/app/google-services.json
          echo "=== compileSdk / targetSdk / minSdk ==="
          grep -E "compileSdk|targetSdk|minSdk" "$APP" | head -6
          grep -E "compileSdk|targetSdk" "$APP" | grep -q "36" || {
            echo "::error::targetSdk is NOT 36 — Google Play will reject this build!"
            exit 1
          }
          MINSDK_FINAL=$(grep -E "^\s*minSdk[^V]" "$APP" | grep -o '[0-9]\+' | head -1)
          if [ -n "$MINSDK_FINAL" ] && [ "$MINSDK_FINAL" -lt 24 ]; then
            echo "::error::minSdk=$MINSDK_FINAL — Play Automatic Protection requires minSdk >= 24! Build will be rejected."
            exit 1
          fi
          echo "✅ minSdk=$MINSDK_FINAL (>= 24 ✓)"
          echo "=== FCM intent filter ==="
          grep "FLUTTER_NOTIFICATION_CLICK" android/app/src/main/AndroidManifest.xml
          echo "=== launchMode (Flutter 3.27.4 already generates this) ==="
          grep "launchMode" android/app/src/main/AndroidManifest.xml
          echo "=== No duplicate attributes check ==="
          python3 -c "
          import xml.etree.ElementTree as ET
          try:
              ET.parse('android/app/src/main/AndroidManifest.xml')
              print('✅ AndroidManifest.xml is valid XML')
          except Exception as e:
              print(f'❌ XML error: {e}')
              exit(1)
          "
          echo "✅ All verified — starting Gradle build"

      - name: Patch geolocator_android build.gradle
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*geolocator_android*" 2>/dev/null | while read -r f; do
            echo "Patching $f"
            sed -i 's/flutter\.compileSdkVersion/36/g'       "$f"
            sed -i 's/flutter\.minSdkVersion/24/g'           "$f"
            sed -i 's/minSdkVersion 21/minSdkVersion 24/g'   "$f"
            sed -i 's/minSdkVersion 23/minSdkVersion 24/g'   "$f"
            sed -i 's/flutter\.targetSdkVersion/36/g'        "$f"
            sed -i 's/flutter\.ndkVersion/"27.0.12077973"/g'  "$f"
            echo "Patched:"
            grep -n "compileSdk\|minSdk\|targetSdk" "$f" || true
          done
          echo "geolocator_android patch done"

      # ── Release signing ───────────────────────────────────────────────────
      # Google Play rejects debug-signed bundles. This step:
      #   1. Decodes the upload keystore from the KEYSTORE_BASE64 secret.
      #   2. Writes android/key.properties from the signing secrets.
      #   3. Rewrites the release buildType in app/build.gradle to use the
      #      release signingConfig (replacing the debug fallback).
      # Required GitHub repo secrets (Settings → Secrets and variables → Actions):
      #   KEYSTORE_BASE64   — base64 of your upload-keystore.jks
      #   KEYSTORE_PASSWORD — the keystore (store) password
      #   KEY_PASSWORD      — the key password
      #   KEY_ALIAS         — the key alias (e.g. upload)
      - name: Configure release signing
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add your signing secrets in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          # 1. Decode keystore into the app module.
          #    Strip ALL whitespace/newlines first — pasting the base64 secret
          #    on mobile often introduces line breaks, which break `base64 -d`.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks 2>/dev/null || {
            echo "::error::Failed to decode KEYSTORE_BASE64. The secret value is not valid base64 — re-copy it as ONE continuous line with no spaces or line breaks, then update the secret and re-run."
            exit 1
          }

          KS_SIZE=$(wc -c < android/app/upload-keystore.jks)
          if [ "$KS_SIZE" -lt 1000 ]; then
            echo "::error::Decoded keystore is only ${KS_SIZE} bytes — that's too small to be valid. The KEYSTORE_BASE64 secret is likely truncated or corrupted. Re-copy the FULL base64 string (everything between BEGIN and END) and update the secret."
            exit 1
          fi
          echo "✓ keystore decoded (${KS_SIZE} bytes)"

          # 2. key.properties (storeFile is relative to the app module).
          cat > android/key.properties << EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
          echo "✓ key.properties written"

          # 3. Inject signingConfigs + point release at it — handles both
          #    Groovy DSL (build.gradle) and Kotlin DSL (build.gradle.kts).
          python3 << 'PYEOF'
          import re, os
          p = os.environ.get('APP', 'android/app/build.gradle')
          s = open(p).read()
          is_kts = p.endswith('.kts')

          # ── Key properties loader ────────────────────────────────────────
          if 'keystoreProperties' not in s:
              if is_kts:
                  loader = (
                      'import java.util.Properties\n'
                      'import java.io.FileInputStream\n\n'
                      'val keystoreProperties = Properties()\n'
                      'val keystorePropertiesFile = rootProject.file("key.properties")\n'
                      'if (keystorePropertiesFile.exists()) {\n'
                      '    keystoreProperties.load(FileInputStream(keystorePropertiesFile))\n'
                      '}\n\n'
                  )
              else:
                  loader = (
                      "def keystoreProperties = new Properties()\n"
                      "def keystorePropertiesFile = rootProject.file('key.properties')\n"
                      "if (keystorePropertiesFile.exists()) {\n"
                      "    keystorePropertiesFile.withReader('UTF-8') { r -> keystoreProperties.load(r) }\n"
                      "}\n\n"
                  )
              s = s.replace("android {", loader + "android {", 1)

          # ── signingConfigs block ─────────────────────────────────────────
          if 'signingConfigs {' not in s:
              if is_kts:
                  sign_block = (
                      '    signingConfigs {\n'
                      '        create("release") {\n'
                      '            keyAlias = keystoreProperties["keyAlias"] as String\n'
                      '            keyPassword = keystoreProperties["keyPassword"] as String\n'
                      '            storeFile = keystoreProperties["storeFile"]?.let { file(it) }\n'
                      '            storePassword = keystoreProperties["storePassword"] as String\n'
                      '        }\n'
                      '    }\n\n'
                      '    buildTypes {'
                  )
              else:
                  sign_block = (
                      "    signingConfigs {\n"
                      "        release {\n"
                      "            keyAlias keystoreProperties['keyAlias']\n"
                      "            keyPassword keystoreProperties['keyPassword']\n"
                      "            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null\n"
                      "            storePassword keystoreProperties['storePassword']\n"
                      "        }\n"
                      "    }\n\n"
                      "    buildTypes {"
                  )
              s = s.replace("buildTypes {", sign_block, 1)

          # ── Point release buildType at release signingConfig ─────────────
          if is_kts:
              if 'signingConfigs.getByName("release")' not in s:
                  if 'signingConfigs.getByName("debug")' in s:
                      s = s.replace(
                          'signingConfig = signingConfigs.getByName("debug")',
                          'signingConfig = signingConfigs.getByName("release")'
                      )
                  else:
                      s = re.sub(
                          r'(getByName\("release"\)\s*\{)',
                          r'\1\n            signingConfig = signingConfigs.getByName("release")',
                          s, count=1
                      )
          else:
              if 'signingConfigs.debug' in s:
                  s = s.replace("signingConfig = signingConfigs.debug",
                                "signingConfig = signingConfigs.release")
                  s = s.replace("signingConfig signingConfigs.debug",
                                "signingConfig signingConfigs.release")
              elif 'signingConfig' not in s.split('buildTypes {',1)[1].split('}',1)[0]:
                  s = re.sub(r"(release\s*\{)",
                             r"\1\n            signingConfig signingConfigs.release",
                             s, count=1)

          open(p, 'w').write(s)
          print(f"✓ {p} updated for release signing ({'KTS' if is_kts else 'Groovy'})")
          PYEOF

          echo "--- release buildType ---"
          grep -A6 "buildTypes {" "$APP"

      - name: Build Release APK
        run: flutter build apk --release --split-debug-info=build/symbols --obfuscate

      - name: Build Release AAB
        run: flutter build appbundle --release --split-debug-info=build/symbols --obfuscate

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-x-v3.1.0-release-${{ github.sha }}
          path: build/app/outputs/
          retention-days: 14
