name: Build NOVA X Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install Android NDK 29 + Build Tools 36
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;29.0.14206865" "build-tools;36.1.0" "platforms;android-36" \
            --sdk_root=$ANDROID_HOME || true
          echo "NDK 29 ready"

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Flutter pub get
        run: flutter pub get

      - name: Patch geolocator_android build.gradle
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -path "*geolocator_android*" 2>/dev/null | while read -r f; do
            sed -i 's/flutter\.compileSdkVersion/36/g' "$f"
            sed -i 's/flutter\.minSdkVersion/21/g' "$f"
            sed -i 's/flutter\.targetSdkVersion/36/g' "$f"
            sed -i 's/flutter\.ndkVersion/"29.0.14206865"/g' "$f"
            echo "geolocator patched: $f"
          done

      - name: Patch jcenter to mavenCentral
        run: |
          CACHE="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$CACHE" -name "build.gradle" -exec sed -i 's/jcenter()/mavenCentral()/g' {} + 2>/dev/null || true

      - name: Copy google-services.json
        run: |
          if [ ! -f "google-services.json" ]; then
            echo "::error::google-services.json NOT FOUND in repo root!"
            exit 1
          fi
          cp google-services.json android/app/google-services.json
          echo "google-services.json copied"

      - name: Set app icon from logo.png
        run: |
          pip install Pillow --break-system-packages -q
          printf '%s' "" | base64 -d > /tmp/gen_icons.py && python3 /tmp/gen_icons.py

      - name: Apply Google Services Plugin (Firebase)
        run: |
          printf '%s' "" | base64 -d > /tmp/apply_gms.py && python3 /tmp/apply_gms.py

      - name: Bump all SDK versions to API 36
        run: |
          F="android/app/build.gradle"
          sed -i 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 36/g' "$F"
          sed -i 's/compileSdk flutter\.compileSdkVersion/compileSdk 36/g' "$F"
          sed -i 's/compileSdk = flutter\.compileSdkVersion/compileSdk = 36/g' "$F"
          sed -i 's/compileSdk 35/compileSdk 36/g' "$F"
          sed -i 's/targetSdkVersion flutter\.targetSdkVersion/targetSdkVersion 36/g' "$F"
          sed -i 's/targetSdk flutter\.targetSdkVersion/targetSdk 36/g' "$F"
          sed -i 's/targetSdk = flutter\.targetSdkVersion/targetSdk = 36/g' "$F"
          sed -i 's/targetSdk 35/targetSdk 36/g' "$F"
          sed -i 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/g' "$F"
          sed -i 's/minSdk flutter\.minSdkVersion/minSdk 23/g' "$F"
          sed -i 's/minSdk = flutter\.minSdkVersion/minSdk = 23/g' "$F"
          grep -E "compileSdk|targetSdk|minSdk" "$F"
          if grep -q "flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion" "$F"; then
            echo "::error::flutter.* SDK refs still present!"
            exit 1
          fi
          echo "SDK versions set to 36"

      - name: Inject NDK 29 + 16KB + abiFilters + packaging
        run: |
          printf '%s' "" | base64 -d > /tmp/inject_ndk.py && python3 /tmp/inject_ndk.py

      - name: Patch AndroidManifest (permissions + FCM + 16KB)
        run: |
          printf '%s' "" | base64 -d > /tmp/patch_manifest.py && python3 /tmp/patch_manifest.py

      - name: Create notification colour + shortcut resources
        run: |
          mkdir -p android/app/src/main/res/values
          mkdir -p android/app/src/main/res/xml
          mkdir -p android/app/src/main/res/drawable
          printf '%s' '<?xml version="1.0" encoding="utf-8"?><resources><color name="nova_x_cyan">#00D4FF</color></resources>' > android/app/src/main/res/values/colors.xml
          printf '%s' '<?xml version="1.0" encoding="utf-8"?><shortcuts xmlns:android="http://schemas.android.com/apk/res/android"><shortcut android:shortcutId="new_tab" android:enabled="true" android:icon="@drawable/ic_sc_new_tab" android:shortcutShortLabel="@string/sc_new_tab_s" android:shortcutLongLabel="@string/sc_new_tab_l"><intent android:action="com.tlyfe.nova_x.NEW_TAB" android:targetPackage="com.tlyfe.nova_x" android:targetClass="com.tlyfe.nova_x.MainActivity"/></shortcut></shortcuts>' > android/app/src/main/res/xml/shortcuts.xml
          printf '%s' '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24"><path android:fillColor="#00D4FF" android:pathData="M19,13H13v6H11v-6H5v-2H11V5H13v6H19v2Z"/></vector>' > android/app/src/main/res/drawable/ic_sc_new_tab.xml
          printf '%s' '<?xml version="1.0" encoding="utf-8"?><resources><string name="sc_new_tab_s">New Tab</string><string name="sc_new_tab_l">Open New Tab in NOVA X</string></resources>' > android/app/src/main/res/values/strings.xml
          echo "Resources created"

      - name: Configure Gradle Java Home
        run: echo "org.gradle.java.home=$JAVA_HOME" >> android/gradle.properties

      - name: Configure release signing
        env:
          KEYSTORE_BASE64:   ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:      ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:         ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > android/app/upload-keystore.jks
          KS=$(wc -c < android/app/upload-keystore.jks)
          [ "$KS" -lt 1000 ] && { echo "::error::Keystore too small (${KS} bytes)"; exit 1; }
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "Keystore ready (${KS} bytes)"
          printf '%s' "" | base64 -d > /tmp/apply_signing.py && python3 /tmp/apply_signing.py
          grep -A10 "buildTypes {" android/app/build.gradle

      - name: Final Verification
        run: |
          echo "=== SDK values ==="
          grep -E "compileSdk|targetSdk|minSdk" android/app/build.gradle | grep -v "//"
          echo "=== ndkVersion ==="
          grep "ndkVersion" android/app/build.gradle
          echo "=== 16KB cmake ==="
          grep "FLEXIBLE_PAGE_SIZES" android/app/build.gradle
          echo "=== LARGE_PAGE_SIZE ==="
          grep "LARGE_PAGE_SIZE" android/app/src/main/AndroidManifest.xml
          echo "=== AD_ID ==="
          grep "AD_ID" android/app/src/main/AndroidManifest.xml
          if grep -q "flutter\.compileSdkVersion\|flutter\.targetSdkVersion\|flutter\.minSdkVersion" android/app/build.gradle; then
            echo "::error::flutter.* refs still present!"
            exit 1
          fi
          printf '%s' "aW1wb3J0IHhtbC5ldHJlZS5FbGVtZW50VHJlZSBhcyBFVApFVC5wYXJzZSgnYW5kcm9pZC9hcHAvc3JjL21haW4vQW5kcm9pZE1hbmlmZXN0LnhtbCcpCnByaW50KCdBbmRyb2lkTWFuaWZlc3QueG1sIHZhbGlkIFhNTCcp" | base64 -d > /tmp/validate_xml.py && python3 /tmp/validate_xml.py
          echo "All checks passed"

      - name: Build Release APK
        run: flutter build apk --release --split-debug-info=build/debug-symbols --obfuscate

      - name: Build Release AAB
        run: flutter build appbundle --release --split-debug-info=build/debug-symbols --obfuscate

      - name: Archive Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nova-x-release-${{ github.sha }}
          path: build/app/outputs/
          retention-days: 14
