plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

android {
    namespace "com.tlyfe.nova_x"
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.tlyfe.nova_x"
        minSdk 24
        targetSdk 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // "Hey NOVA" (sherpa-onnx): only the JNI library and ONNX Runtime for ARM
    // phones are needed; the rest of the AAR's native libraries are left out.
    packaging {
        jniLibs.excludes.add("**/libsherpa-onnx-c-api.so")
        jniLibs.excludes.add("**/libsherpa-onnx-cxx-api.so")
        jniLibs.excludes.add("lib/x86/libsherpa-onnx-jni.so")
        jniLibs.excludes.add("lib/x86/libonnxruntime.so")
        jniLibs.excludes.add("lib/x86_64/libsherpa-onnx-jni.so")
        jniLibs.excludes.add("lib/x86_64/libonnxruntime.so")
    }
}

flutter {
    source '../..'
}

dependencies {
    // Required by the AppCompat themes in res/values/styles.xml
    // (local_auth on FlutterFragmentActivity needs an AppCompat theme).
    implementation("androidx.appcompat:appcompat:1.7.0")

    // "Hey NOVA" on-device wake word engine (sherpa-onnx 1.13.8, Apache-2.0).
    // CI downloads it (SHA-256 checked). Local builds: see NOVA_DEPLOYMENT_GUIDE.md.
    implementation(files("libs/sherpa-onnx-1.13.8.aar"))
}
