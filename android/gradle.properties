org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# 3.12.3 — Google Play 16 KB memory pages: the Rive animations' text library
# (librive_text.so) is compiled by rive_common with its own NDK. NDK r28
# produces 16 KB-aligned libraries by default (same NDK as the app).
rive.ndk.version=28.2.13676358
# rive_common still declares minSdk 19; NDK r28 builds from API 21 up. The app
# itself needs Android 7 (API 24), so building that library for API 21 is safe.
android.ndk.suppressMinSdkVersionError=21
